spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_booking?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
notifications:
  email-from: ${NOTIFICATION_EMAIL_FROM:}
jwt:
  secret: ${JWT_SECRET:MovieBookingLocalJwtSecretKeyChangeMe2026}
  expiration-ms: ${JWT_EXPIRATION_MS:2592000000}
auth:
  mobile:
    country-code: ${MOBILE_COUNTRY_CODE:91}
    national-length: ${MOBILE_NATIONAL_LENGTH:10}
  otp:
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:10}
app:
  cors-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  admin:
    mobile: ${ADMIN_MOBILE:}
    email: ${ADMIN_EMAIL:}
server:
  port: 443
  ssl:
    enabled: true
    key-store: file:/opt/keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: springboot
  error:
    include-message: never
booking:
  seat-hold-minutes: ${BOOKING_SEAT_HOLD_MINUTES:5}
  waiting-list-offer-minutes: ${BOOKING_WAITING_LIST_OFFER_MINUTES:5}
